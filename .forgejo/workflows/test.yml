# The checks of every change (the bot has no tests: its requirements install, and its
# modules compile and import, which an update that removed what they use fails):
# pushes to main and to renovate/all-patch, where Renovate's patches merge from once this
# passes (no ignoreTests in renovate.json), and pull requests.
name: Test
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
'on':
  push:
    branches:
    - main
    - renovate/all-patch
  pull_request: null
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Compile the modules
      run: python -m compileall -q src
    # config.py reads its settings when imported: stand-ins here, and an empty config.env
    # for the one git-crypt encrypts (no key in this job, so the file is not readable).
    - name: Import the modules
      working-directory: src
      env:
        CHATGPT_USER_EMAIL: test@example.org
        CHATGPT_USER_PASSWORD: test
        HEROKU_WEB_URL: https://example.org
        SCHULPORTAL_AJAX_URL: https://example.org
        SCHULPORTAL_LOGIN_URL: https://example.org
        SCHULPORTAL_NACHRICHTEN_URL: https://example.org
        SCHULPORTAL_MEINUNTERRICHT_URL: https://example.org
        SCHULPORTAL_START_URL: https://example.org
        SCHULPORTAL_VERTRETUNGSPLAN_URL: https://example.org
        TELEGRAM_API_TOKEN: test
      run: |
        : > ../config.env
        python -c 'import config, errors, portal, portalbot, webhook, main'
