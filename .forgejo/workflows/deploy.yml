# Converted from .github/workflows/deploy.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: deploy_to_heroku
'on':
  push:
    tags:
    - v*
jobs:
  build_and_release:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Deploy schulportal-telegram-bot to Heroku
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install git-crypt and decrypt repository
      env:
        GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      run: |
        sudo apt-get update && \
        sudo apt-get install -y git-crypt && \
        echo "$GIT_CRYPT_KEY" | base64 -d | git-crypt unlock - && \
        git-crypt status -e
    - name: Install Heroku CLI
      run: |
        curl https://cli-assets.heroku.com/install.sh | sh
    - name: Get app url
      uses: https://github.com/akhileshns/heroku-deploy@v3.15.15
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: ''
        heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
        justlogin: true
    - name: Deploy to Heroku
      uses: https://github.com/akhileshns/heroku-deploy@v3.15.15
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
        usedocker: true
